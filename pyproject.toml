[project]
name = "apto-maker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinicius", email = "viniciusfirmino327@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "ezdxf>=1.4.4",
]

[project.scripts]
apto-maker = "apto_maker:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
